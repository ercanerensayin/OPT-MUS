<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>OPT-MUS · Tek promptla site ve kod uret</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>⚡</text></svg>">
<link rel="stylesheet" href="style.css">
</head>
<body>

<aside class="sidebar" id="sidebar">
  <div class="brand">
    <span class="mark">⚡</span>
    <div>
      <strong>OPT-MUS</strong>
      <small id="providerLabel">baglaniyor…</small>
    </div>
  </div>

  <button class="btn btn-block" id="newProject">+ Yeni proje</button>

  <div class="project-list" id="projectList"></div>

  <div class="sidebar-foot">
    <a href="https://github.com/ercanerensayin/OPT-MUS" target="_blank" rel="noreferrer">Kaynak kod</a>
  </div>
</aside>

<main class="main">
  <header class="topbar">
    <button class="icon-btn only-mobile" id="menuBtn" aria-label="Menuyu ac">☰</button>
    <h1 id="projectTitle">Yeni proje</h1>
    <div class="spacer"></div>
    <button class="btn ghost" id="downloadBtn" disabled>ZIP indir</button>
    <a class="btn ghost" id="openBtn" target="_blank" rel="noreferrer" hidden>Yeni sekmede ac</a>
  </header>

  <section class="composer">
    <div class="modes" role="tablist" aria-label="Uretim turu">
      <button class="mode active" data-mode="site" role="tab" aria-selected="true">Web sitesi</button>
      <button class="mode" data-mode="app" role="tab" aria-selected="false">Web uygulamasi</button>
      <button class="mode" data-mode="code" role="tab" aria-selected="false">Kod / betik</button>
    </div>

    <div class="prompt-row">
      <textarea id="promptInput" rows="2" placeholder="Ornek: kahve dukkanim icin menu, galeri ve rezervasyon formu olan tek sayfalik bir site yap"></textarea>
      <button class="btn primary" id="generateBtn">Uret</button>
    </div>

    <div class="examples" id="examples">
      <button>Portfolyo sitesi: proje galerisi, hakkimda, iletisim formu</button>
      <button>Yapilacaklar uygulamasi: filtre, surukle-birak, localStorage</button>
      <button>Kripto fiyat paneli: arama, siralama, sahte veri grafigi</button>
      <button>Python ile klasordeki gorselleri toplu yeniden boyutlandiran betik</button>
    </div>
  </section>

  <section class="workspace">
    <div class="pane pane-code">
      <div class="pane-head">
        <span class="pane-title">Dosyalar</span>
        <span class="status-chip" id="statusChip">hazir</span>
      </div>
      <div class="code-body">
        <nav class="file-tree" id="fileTree"></nav>
        <pre class="code-view"><code id="codeView">Uretim baslayinca kod burada akmaya baslar.</code></pre>
      </div>
    </div>

    <div class="pane pane-preview">
      <div class="pane-head">
        <span class="pane-title">Canli onizleme</span>
        <div class="viewport-switch" id="viewportSwitch">
          <button class="active" data-w="100%">Masaustu</button>
          <button data-w="768px">Tablet</button>
          <button data-w="390px">Telefon</button>
        </div>
      </div>
      <div class="preview-body">
        <div class="preview-frame" id="previewFrame">
          <iframe id="preview" title="Onizleme" sandbox="allow-scripts allow-forms allow-modals allow-popups"></iframe>
          <div class="empty" id="previewEmpty">
            <p><strong>Henuz bir sey uretilmedi.</strong></p>
            <p>Yukariya ne istedigini yaz ve <em>Uret</em>'e bas.</p>
          </div>
        </div>
      </div>
    </div>
  </section>

  <div class="plan-bar" id="planBar" hidden></div>
</main>

<script src="app.js"></script>
</body>
</html>
